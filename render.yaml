services:
  - type: web
    name: shopflow
    runtime: docker
    plan: free
    branch: master
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopflow-db
          property: connectionString
      - key: SHOPFLOW_SESSION_SECRET
        generateValue: true
      - key: SHOPFLOW_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SHOPFLOW_EMAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

databases:
  - name: shopflow-db
    plan: free
    databaseName: shopflow
    user: shopflow
